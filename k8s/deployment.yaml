
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: sentiment

  template:
    metadata:
      labels:
        app: sentiment

    spec:
      imagePullSecrets:
        - name: ecr-secret

      terminationGracePeriodSeconds: 70

      containers:
        - name: flask
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8080



          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "2Gi"